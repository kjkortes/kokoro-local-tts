[project]
name = "kokoro-local-tts"
version = "0.1.0"
description = "A private local Kokoro text-to-speech workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2,<2",
  "kokoro>=0.9.4,<1",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "torch>=2.2,<3",
  "torchaudio~=2.8.0",
  "torchvision~=0.23.0",
  "uvicorn[standard]>=0.35,<1",
  "whisperx>=3.8.6,<3.9",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kokoro_app"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning",
  "ignore:dropout option adds dropout.*:UserWarning",
  "ignore:`torch.nn.utils.weight_norm` is deprecated.*:FutureWarning",
  "ignore:`torch.jit.script` is deprecated.*:DeprecationWarning",
  "ignore:open_text is deprecated.*:DeprecationWarning",
]
markers = ["smoke: downloads and runs the real Kokoro model"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
